- name: Prepare all members and shared name resolution
  hosts: mongodb
  become: true
  gather_facts: false
  tasks:
    - name: Wait for SSH and cloud-init
      ansible.builtin.wait_for_connection:
        timeout: 600
    - name: Wait for cloud-init package operations
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ mongo_hostname }}"
    - name: Resolve every replica member by its private address
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} JENKINS MONGODB LAB"
        block: |
          {% for node in groups['mongodb'] %}
          {{ hostvars[node].private_ip }} {{ hostvars[node].mongo_hostname }} {{ node }}
          {% endfor %}
    - name: Install repository prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, gnupg, curl]
        update_cache: true
        lock_timeout: 300
    - name: Install MongoDB repository signing key
      ansible.builtin.get_url:
        url: https://pgp.mongodb.com/server-8.0.asc
        dest: /usr/share/keyrings/mongodb-server-8.0.asc
        mode: '0644'
    - name: Configure official MongoDB 8.0 repository
      ansible.builtin.apt_repository:
        repo: deb [arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-8.0.asc] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse
        filename: mongodb-org-8.0
    - name: Install MongoDB and shell without auto-starting a standalone server
      ansible.builtin.apt:
        name: mongodb-org
        state: present
        update_cache: true
        policy_rc_d: 101
        lock_timeout: 300

- name: Configure and restart members one at a time
  hosts: mongodb
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Validate persistent shared key
      ansible.builtin.assert:
        that:
          - lookup('env', 'MONGO_KEYFILE') is match('^[A-Za-z0-9+/=]{6,1024}$')
        fail_msg: Use the same single-line base64 key on every run.
      no_log: true
    - name: Write internal authentication key
      ansible.builtin.copy:
        content: "{{ lookup('env', 'MONGO_KEYFILE') }}"
        dest: /etc/mongodb-keyfile
        owner: mongodb
        group: mongodb
        mode: '0400'
      no_log: true
      notify: Restart MongoDB
    - name: Write MongoDB configuration
      ansible.builtin.template:
        src: mongod.conf.j2
        dest: /etc/mongod.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart MongoDB
    - name: Apply configuration
      ansible.builtin.meta: flush_handlers
    - name: Ensure MongoDB starts on boot
      ansible.builtin.systemd_service:
        name: mongod
        state: started
        enabled: true
    - name: Wait for local listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 27017
        timeout: 120
    - name: Install cluster helper
      ansible.builtin.copy:
        src: cluster.js
        dest: /usr/local/lib/mongodb-lab-cluster.js
        owner: root
        group: root
        mode: '0644'
    - name: Wait for existing member to be ready before touching next node
      ansible.builtin.command:
        argv: [mongosh, --quiet, --host, 127.0.0.1, --file, /usr/local/lib/mongodb-lab-cluster.js]
      environment:
        LAB_PHASE: ready
      register: ready
      until: ready.rc == 0
      retries: 120
      delay: 5
      changed_when: false
  handlers:
    - name: Restart MongoDB
      ansible.builtin.systemd_service:
        name: mongod
        state: restarted
